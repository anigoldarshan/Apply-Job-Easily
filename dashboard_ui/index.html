<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233a5ce5'/><path d='M8 13h16v11H8z M13 13v-3.5h6V13' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f4f5f9; --panel:#fff; --panel-2:#f1f3f8; --panel-3:#e6e9f1; --line:#e3e6ee; --text:#171a23; --muted:#6a7183; --faint:#9aa1b2;
  --accent:#3a5ce5; --accent-2:#5b7bff; --accent-soft:#eaefff; --on-accent:#fff;
  --good:#12805c; --good-soft:#e1f5ec; --warn:#b4610a; --warn-soft:#fff1de; --bad:#c3362b; --bad-soft:#fde8e6; --info:#6a4fd8; --info-soft:#f0ebff;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 4px 16px rgba(20,24,40,.04); --shadow-lg:0 20px 60px rgba(15,20,40,.18);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --panel:#171a21; --panel-2:#1e222b; --panel-3:#2a303c; --line:#2a2f3a; --text:#e8eaf0; --muted:#9ba3b4; --faint:#6d7486;
  --accent:#7d97ff; --accent-2:#9aafff; --accent-soft:#222a45; --on-accent:#0f1116;
  --good:#45c58f; --good-soft:#15291f; --warn:#f2a64a; --warn-soft:#33270f; --bad:#f2766c; --bad-soft:#3a1c1a; --info:#ad9cff; --info-soft:#28224a;
  --shadow:none; --shadow-lg:0 20px 60px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0f1116; --panel:#171a21; --panel-2:#1e222b; --panel-3:#2a303c; --line:#2a2f3a; --text:#e8eaf0; --muted:#9ba3b4; --faint:#6d7486;
  --accent:#7d97ff; --accent-2:#9aafff; --accent-soft:#222a45; --on-accent:#0f1116;
  --good:#45c58f; --good-soft:#15291f; --warn:#f2a64a; --warn-soft:#33270f; --bad:#f2766c; --bad-soft:#3a1c1a; --info:#ad9cff; --info-soft:#28224a;
  --shadow:none; --shadow-lg:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:2px 10px 20px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:550;position:relative}
.nav:hover{background:var(--panel-2);color:var(--text)}
.nav.active{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;font-style:normal}
.nav .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.3s infinite}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:16px 12px 4px;font-weight:700}
.side .sp{flex:1}
.side .foot{border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .n{font-weight:600;font-size:13px;line-height:1.2} .me .s{font-size:12px;color:var(--muted)}
main{padding:22px 32px 80px;min-width:0;max-width:1320px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:22px;flex:1;min-width:150px}
.topbar .sub{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:2px;letter-spacing:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s;text-decoration:none!important;color:var(--text)}
.btn:hover{background:var(--panel-2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{filter:brightness(1.07)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--bad)} .btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--panel-2)}
.btn.lg{padding:12px 22px;font-size:15.5px;border-radius:12px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px} .faint{color:var(--faint)}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.mt{margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--muted);white-space:nowrap;border:1px solid var(--line);cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pulse .dot{animation:pulse 1.3s infinite} @keyframes pulse{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-applied{background:var(--good-soft);color:var(--good)} .c-manual{background:var(--warn-soft);color:var(--warn)}
.c-dry{background:var(--info-soft);color:var(--info)} .c-skipped{background:var(--panel-2);color:var(--muted)} .c-error{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--panel-2);font-size:12px;color:var(--muted);font-weight:550}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty .big{font-size:34px;margin-bottom:6px}
.empty h3{color:var(--text);font-size:15px;margin-bottom:4px}
.empty p{margin:0 0 14px}
.hidden{display:none!important}

.hero{border-radius:18px;padding:24px 26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--accent-soft),var(--panel) 70%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero.warn{background:linear-gradient(120deg,var(--warn-soft),var(--panel) 70%)}
.hero.good{background:linear-gradient(120deg,var(--good-soft),var(--panel) 70%)}
.hero .ic{width:56px;height:56px;border-radius:16px;background:var(--panel);display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow);flex:none}
.hero .tx{flex:1;min-width:220px}
.hero h2{font-size:19px;margin-bottom:4px}
.hero p{margin:0;color:var(--muted)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.mini-stats{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.mini-stats div{font-size:12.5px;color:var(--muted)} .mini-stats b{display:block;font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}

.check{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px}
.ck[data-i]:hover{background:var(--panel-2)}
.ck .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.ck.done .b{background:var(--good);border-color:var(--good)}
.ck.done .t{color:var(--muted);text-decoration:line-through}
.ck .t{flex:1;font-weight:550}
.ck .o{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.04em}
.progress{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width .4s}

.kpi{display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
.kpi:hover{border-color:var(--accent)}
.kpi .ki{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}

.chart{display:flex;align-items:flex-end;gap:5px;height:190px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.chart .stk{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;border-radius:6px}
.chart .stk:hover{background:var(--panel-2)}
.chart .sg{width:100%;border-radius:5px}
.chart .s1{background:var(--accent)} .chart .s2{background:var(--warn)} .chart .s3{background:var(--panel-3)}
.chart .lb{font-size:10.5px;color:var(--faint)}
.chart .col.today .lb{color:var(--accent);font-weight:700}
.chart .stk:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11.5px;padding:6px 9px;border-radius:8px;white-space:pre;z-index:5;line-height:1.4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.rw{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0}
.rw:last-child{border-bottom:none}
.rw .g{flex:1;min-width:0}
.rw .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button .n{font-size:11.5px;color:var(--faint);margin-left:5px;font-weight:700}

.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px;display:block}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{padding-left:38px!important;width:100%;border:none!important;box-shadow:none!important;background:transparent}
.input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;outline:none;min-width:0;transition:border-color .12s,box-shadow .12s}
.input:focus,.input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{width:100%;resize:vertical}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s;box-shadow:var(--shadow);min-width:0}
.job:hover{border-color:var(--accent)}
.job .top{display:flex;gap:12px;align-items:flex-start}
.job .tt{flex:1;min-width:0}
.job .tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.job .tt .co{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:7px 10px}
.job .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:650;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;min-width:50px}
.bar span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none} .menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:240px;z-index:30;display:flex;flex-direction:column}
.menu .pop button,.menu .pop a{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:550;font-size:13.5px;color:var(--text)}
.menu .pop button:hover,.menu .pop a:hover{background:var(--panel-2)}

.live-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.live-head .big{font-size:20px;font-weight:700}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.counter{background:var(--panel-2);border-radius:12px;padding:12px 14px}
.counter b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.counter span{font-size:12.5px;color:var(--muted);font-weight:600}
.site-step{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.site-step:last-child{border-bottom:none}
.site-step .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--faint);flex:none;font-size:12px;font-weight:700}
.site-step.cur .st{background:var(--accent);color:#fff;animation:pulse 1.3s infinite}
.site-step.done .st{background:var(--good-soft);color:var(--good)}
.feed{max-height:430px;overflow:auto}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.ev:last-child{border-bottom:none}
.ev .e{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px}
.ev .g{flex:1;min-width:0}
.ev time{font-size:11.5px;color:var(--faint);white-space:nowrap}
.needs{border-radius:14px;padding:16px 18px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.needs .tx{flex:1;min-width:220px}
.console{background:#0c1017;color:#cfd6e1;font-family:var(--mono);font-size:12.5px;border-radius:12px;padding:12px 14px;height:380px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.console .ok{color:#56d364} .console .wn{color:#e3b341} .console .er{color:#f47067} .console .you{color:#79c0ff;font-weight:600} .console .hd{color:#bc8cff;font-weight:600}
details.tech summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.tech summary::-webkit-details-marker{display:none}
details.tech[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

.set-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.set-nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px}
.set-nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;border:1px solid transparent}
.set-nav button:hover{background:var(--panel)}
.set-nav button.on{background:var(--panel);box-shadow:var(--shadow);border-color:var(--line)}
.set-nav .em{font-size:18px;width:24px;text-align:center}
.set-nav b{display:block;font-size:13.5px;font-weight:600} .set-nav small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.set-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.set-head h2{font-size:18px;flex:1}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved.ok{color:var(--good)} .saved.busy{color:var(--warn)} .saved.err{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px 22px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.field .help{font-size:12.5px;color:var(--muted)}
.field .input{width:100%}
.adv-tag{font-size:10px;font-weight:700;color:var(--info);background:var(--info-soft);padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.unit{display:flex}
.unit .input{border-top-right-radius:0;border-bottom-right-radius:0}
.unit>span{border:1px solid var(--line);border-left:none;padding:8px 12px;border-radius:0 10px 10px 0;background:var(--panel-2);color:var(--muted);font-size:13px;white-space:nowrap}
.tog{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tog:hover{background:var(--panel-2)}
.tog input{appearance:none;width:40px;height:23px;border-radius:999px;background:var(--panel-3);position:relative;cursor:pointer;transition:.15s;flex:none;margin:1px 0 0}
.tog input::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--accent)} .tog input:checked::after{left:19px}
.tog b{display:block;font-weight:600;font-size:13.5px} .tog small{color:var(--muted);font-size:12.5px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:text;padding:6px 8px;min-height:42px}
.chips .ch{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 4px 3px 10px;font-weight:600;font-size:13px}
.chips .ch button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:15px;line-height:1}
.chips .ch button:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}

const SKILL_VOCAB = [...new Set([...ROLES.flatMap(r => r.sk), ...TITLE_SKILLS.flatMap(r => r.sk), ...EXTRA_SKILLS])];
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const inResume = (text, group) => group.split("|").some(t => hasTerm(text, t.trim().toLowerCase()));
/* skill groups found in the resume that aren't in `mine` yet */
function resumeSkills(text, mine) {
  const t = (text || "").toLowerCase(), used = new Set((mine || []).flatMap(g => g.toLowerCase().split("|").map(x => x.trim())));

  const named = g => hasTerm(t, g.split("|")[0]);

function explain(j) {
  const s = (j.status || "").toLowerCase(), min = (STATE.run_plan || {}).min_match ?? 50;
  if (s === "applied") return "The bot sent your application.";
  if (s.startsWith("match (dry")) return "Good match found in a test run. Your next live run applies to it automatically.";
  if (j.reason && !s.includes("needs manual")) return esc(j.reason);
  if (s.includes("company site")) return "Good match, but it has to be applied for on the company's own website.";
  if (s.includes("not easy apply")) return "Good match, but LinkedIn Easy Apply isn't available for it.";
  if (s.includes("no apply button") || s.includes("walk-in")) return "Good match, but there was no apply button (maybe a walk-in).";
  if (s.includes("needs manual")) return esc(j.reason || "Tried automatically, but the form asked something the bot couldn't answer. Please apply manually.") + " Tip: add that answer in Settings → Answers.";
  if (s.includes("low match")) return `Only ${j.match}% of your skills were mentioned (you apply from ${min}%).`;
  if (s.includes("title/company")) return "The job title or company is filtered out in Settings → Skills & matching.";
  if (s.includes("isn't one of your job titles")) return "The job title doesn't match any of your job titles in Settings → Jobs to find.";
  if (s.includes("title has")) return `The title contains “${esc((j.status.match(/'(.+)'/) || [, "a skipped word"])[1])}”, which is on your skip list in Settings → Skills & matching.`;
  if (s.includes("company filter")) return "This company is on your “never apply” list.";
  if (s.includes("experience")) return `It asks for ${esc((j.status.split("experience")[1] || "different").trim())} experience, which doesn't fit yours.`;
  if (s.includes("already applied")) return "You had already applied to this job.";
  if (s.startsWith("error")) return "The page didn't load in time. It's tried again on the next run.";
  return esc(j.status);
}

    <div class="small muted" style="margin-top:12px">Chrome opens by itself. Leave it open; you can watch the bot work in it.</div>

  const paint = () => { $$(".choice", m).forEach(c => c.classList.toggle("on", c.dataset.m === mode)); $("[data-pend]", m)?.classList.toggle("hidden", mode !== "live"); $("[data-run]", m).innerHTML = I.play + (mode === "test" ? "Start test run" : "Start applying"); };
  $$(".choice", m).forEach(c => c.onclick = () => { mode = c.dataset.m; paint(); });
  $("[data-x]", m).onclick = () => m.remove();

  $("[data-signin]", m)?.addEventListener("click", e => { e.preventDefault(); m.remove(); openSignIn(); });

  };

}
function stopRun() {

}

function paintStats() {

function chipInput(get, set, {ph = "Type and press Enter", sugg = [], lower = false, onType = null} = {}) {
  const w = h(`<div><div class="chips input"></div><div class="sugg"></div></div>`), box = $(".chips", w), sg = $(".sugg", w);

    const add = t => { inp.value = ""; onType && onType(""); t = t.trim().replace(/,$/, "").trim(); if (lower) t = t.toLowerCase(); if (t && !v.some(x => x.toLowerCase() === t.toLowerCase())) { set([...v, t]); draw(true); } else inp.value = ""; };
    inp.onkeydown = e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(inp.value); } else if (e.key === "Backspace" && !inp.value && v.length) { set(v.slice(0, -1)); draw(true); } };

    $$("button", box).forEach(b => b.onclick = () => { set(v.filter((_, i) => i !== +b.dataset.i)); draw(); });

    sg.innerHTML = s.map(x => `<button type="button">+ ${esc(x)}</button>`).join("");

/* =================================================================== QUESTIONS THE BOT GOT STUCK ON */
async function renderQuestions() {
  $("#view").innerHTML = `<div class="card"><div class="card-h"><h2>Questions the bot got stuck on</h2></div>
    <p class="muted small" style="margin-top:-6px">Job forms asked these and the bot didn't know the answer, so it left those applications for you. Answer once: the bot retries those jobs in the next live run and remembers the answer for every future form.</p>
    <div id="qList"><div class="empty">Loading…</div></div></div>`;
  let QS = [];
  try { QS = await api("/api/questions"); } catch (e) { $("#qList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const draw = () => {
    if (!QS.length) { $("#qList").innerHTML = `<div class="empty"><div class="big">🎉</div><h3>Nothing to answer</h3><p>When a form asks something the bot doesn't know, it shows up here.</p></div>`; return; }
    $("#qList").innerHTML = QS.map((q, i) => `<div class="card" style="margin-top:12px;box-shadow:none;border:1px solid var(--line)" data-q="${i}">
      <div style="font-weight:650;font-size:15px">${esc(q.text)}</div>
      <div class="muted small" style="margin:4px 0 10px">${esc(q.site || "")} · asked ${plural(q.times, "time")}${q.blocked ? ` · <b>${plural(q.blocked, "job")}</b> waiting on it` : ""}${q.jobs.length ? `: ${q.jobs.slice(0, 3).map(j => esc(j.title) + (j.company ? " at " + esc(j.company) : "")).join(", ")}${q.blocked > 3 ? "…" : ""}` : ""}</div>
      ${q.options.length ? `<div class="r" style="display:flex;flex-wrap:wrap;gap:6px">${q.options.slice(0, 30).map((o, k) => `<button class="btn sm" data-opt="${k}">${esc(o)}</button>`).join("")}</div>`
        : `<div style="display:flex;gap:8px;flex-wrap:wrap"><input class="input" style="flex:1;min-width:200px" placeholder="Your answer" data-txt><button class="btn sm primary" data-save>Save answer</button></div>`}
      <div style="margin-top:8px"><button class="btn sm ghost" data-ign title="Hide it. The bot keeps leaving these jobs for you.">Not now</button></div></div>`).join("");
    $$("[data-q]").forEach(card => {
      const q = QS[+card.dataset.q];
      const send = async ans => {
        if (!String(ans || "").trim()) return toast("Type an answer first", true);
        try {
          const r = await api("/api/questions/answer", {body: {q: q.q, answer: ans}});
          toast(r.retry ? `Saved. ${plural(r.retry, "job")} will be retried in the next live run.` : "Saved. The bot will use this answer from now on.");
          QS.splice(QS.indexOf(q), 1); draw(); refresh();
        } catch (e) { toast(e.message, true); }
      };
      $$("[data-opt]", card).forEach(b => b.onclick = () => send(q.options[+b.dataset.opt]));
      const inp = $("[data-txt]", card);
      if (inp) { $("[data-save]", card).onclick = () => send(inp.value); inp.onkeydown = e => { if (e.key === "Enter") send(inp.value); }; }
      $("[data-ign]", card).onclick = async () => { await api("/api/questions/ignore", {body: {q: q.q}}); QS.splice(QS.indexOf(q), 1); draw(); refresh(); };
    });
  };
  draw();
}

  const draw = () => {
    const q = $("#laQ").value.toLowerCase(), rows = LA.map((e, i) => [e, i]).filter(([[k, v]]) => !q || (k + " " + v).toLowerCase().includes(q));
    $("#laList").innerHTML = rows.length ? `<div class="kv">${rows.map(([[k, v], i]) => `<div class="r" style="grid-template-columns:2fr 1fr 36px"><input class="input" data-i="${i}" data-p="0" value="${esc(k)}" placeholder="Question"><input class="input" data-i="${i}" data-p="1" value="${esc(v)}" placeholder="Answer"><button class="icon-btn" data-del="${i}" title="Remove">${I.x}</button></div>`).join("")}</div>`
      : `<div class="empty"><div class="big">🧠</div>${LA.length ? "Nothing matches." : "Nothing learned yet. Answers appear here after the bot meets new questions."}</div>`;
    $$("[data-i]").forEach(inp => inp.oninput = () => LA[+inp.dataset.i][+inp.dataset.p] = inp.value);
    $$("[data-del]").forEach(b => b.onclick = () => { LA.splice(+b.dataset.del, 1); draw(); });
  };
  $("#laQ").oninput = draw;
  $("#laAdd").onclick = () => { LA.unshift(["", ""]); $("#laQ").value = ""; draw(); $("#laList input").focus(); };
  $("#laSave").onclick = async () => { const o = {}; LA.forEach(([k, v]) => { if (k.trim()) o[k.trim().toLowerCase()] = v; }); await api("/api/learned", {body: o}); toast("Saved"); };
  draw();
}
async function renderSites() {
  $("#view").innerHTML = `<div class="card"><div class="card-h"><h2>Site rules (sites.yaml)</h2><div class="r"><button class="btn sm" id="srReload">Reload</button><button class="btn sm primary" id="srSave">Check & save</button></div></div>
    <div class="callout" style="margin-bottom:12px">For when Foundit, Shine, Cutshort or Indeed change their pages. Copy a search URL from your browser into <code>search_url</code>, replacing your words with <code>{kw}</code> and <code>{loc}</code>. It's checked before saving, and the old version is kept as sites.yaml.bak.</div>
    <textarea class="input" id="srText" rows="30" spellcheck="false" style="font-family:var(--mono);font-size:13px"></textarea></div>`;
  const load = async () => { $("#srText").value = (await api("/api/sites")).text; };
  $("#srReload").onclick = load;
  $("#srSave").onclick = async () => { try { await api("/api/sites", {body: {text: $("#srText").value}}); toast("Saved"); } catch (e) { toast("Not saved: " + e.message, true); } };
  load();
}

/* =================================================================== HELP */
function openHelp() {
  const qa = [
    ["What's the difference between a test run and a live run?", "A test run searches and scores jobs but sends nothing, so you can check the matches. A live run applies to the good matches. Start with a test run."],
    ["Why was a job skipped?", "Click it in Jobs: each one says why in plain words. Usually too few of your skills were mentioned, or the title is filtered out. Change this in Settings → Skills & matching."],
    ["What does “Apply manually” mean?", "Good matches the bot tried but couldn't apply to by itself: the job is on the company's own website, or the form asked something unusual. Each one says what happened. Click Apply, then mark it “I applied”."],
    ["Will it apply to the same job twice?", "No. Every job is saved in a small database on this computer (jobs.db). Jobs you've applied to are never opened again, so each run only applies to new jobs. Good matches from a test run are applied to in your next live run."],
    ["The bot says it needs me", "Look at the Chrome window the bot uses. Finish logging in (then click Continue), or answer the question shown. You'll hear a chime when this happens."],
    ["Chrome won't open, or isn't reachable", "Close every Chrome window, including any in the taskbar tray, then try again. The bot needs to start its own Chrome."],
    ["Is my data safe?", "Everything stays on this computer. The dashboard only opens on this PC. Passwords and keys are kept in config.yaml in the bot's folder, so never share that file."],
    ["Do I need to upload my resume?", "It's strongly recommended. Many application forms ask for a resume file; without one, those jobs end up under “Apply manually”. Upload it in Settings → About you. Naukri and LinkedIn usually use the resume saved on your profile there, so keep that one up to date too."],
    ["Could my account get blocked?", "LinkedIn and Naukri don't allow automated applying. Keep it to 20–30 applications per site per run, once or twice a day, and stay near the computer for OTPs."],
    ["A site stopped working", "Sites change their pages often. If one keeps finding nothing, switch it off in Settings → Job sites. Advanced users can fix Foundit, Shine, Cutshort and Indeed in Site rules."],
    ["What is the Questions page?", "When a job form asks something the bot can't answer (for example a dropdown with unusual choices), it stops that application and lists the question there. Answer it once: the bot retries those jobs in the next live run and answers that question by itself from then on."],
    ["Are my passwords safe?", "Passwords and API keys are encrypted with your Windows login, so the settings file shows only scrambled text, and they don't work if the file is copied to another computer. The dashboard never shows them again after you save them; type a new one to replace it."],
    ["How do I give this to a friend or install it on another laptop?", "Click “Download a fresh copy” below. The zip has only the program: none of your settings, passwords, resume, jobs or Chrome logins. Unzip it on the other laptop and double-click Install.bat. It starts empty, with the setup wizard."],
  ];
  const d = drawer(`<div class="dh"><h2 style="flex:1">Help</h2><button class="icon-btn" data-close title="Close">${I.x}</button></div><div class="db"><div class="faq">${qa.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
    <div class="callout" style="margin-bottom:10px"><b>Install on another laptop</b><br><span class="small">A clean copy with none of your data. The new person starts from the setup wizard.</span><div style="margin-top:8px"><a class="btn sm primary" href="/api/package" download>${I.down} Download a fresh copy (.zip)</a></div></div>
    <div class="callout">Want the guided setup again? <a href="#" id="redoWiz">Open the setup wizard</a></div></div>`);
  $("[data-close]", d).onclick = closeDrawer;
  $("#redoWiz").onclick = e => { e.preventDefault(); closeDrawer(); openWizard(true); };
}

/* =================================================================== SETUP WIZARD */
let W = {}, wStep = 0;
async function openWizard(again) {
  if (wizOpen) return; wizOpen = true;
  try {
    const c = await api("/api/config"), a = c.answers || {};
    await loadResume().catch(() => {});
    W = {name: getp(c, "profile.name") || "", email: getp(c, "profile.email") || "", phone: a.phone || "", experience_years: getp(c, "search.experience_years") || "",
      role: null, keywords: getp(c, "search.keywords") || [], locations: getp(c, "search.locations") || [], skills: getp(c, "match.skills") || [],
      title_must_include: getp(c, "match.title_must_include") || [], skill_years: "", notice: a["notice period"] || "", current_location: a["current location"] || "",
      current_ctc: a["current ctc"] || "", expected_ctc: a["expected ctc"] || "", ai_provider: "", ai_key: "", about_me: getp(c, "ai.about_me") || ""};
  } catch (e) { wizOpen = false; return; }
  wStep = 0;
  const o = modal(`<div id="wizard"></div>`, "wide");
  if (!again) o.dataset.lock = "1";
  new MutationObserver((_, obs) => { if (!o.isConnected) { wizOpen = false; obs.disconnect(); } }).observe($("#layer"), {childList: true});
  drawWizard();
}
const WSTEPS = [
  {t: "Welcome to Job Bot 👋", s: "Let's set it up for you. It takes about 3 minutes, and everything stays on this computer.", req: ["name", "experience_years"], f: [
    {p: "name", t: "text", l: "Your full name *"}, {p: "email", t: "text", l: "Email", h: "Optional. Reports can be sent here."},
    {p: "phone", t: "text", l: "Phone number", str: true}, {p: "experience_years", t: "number", step: .1, l: "Total work experience *", unit: "years"}]},
  {t: "Upload your resume 📄", s: "Optional, but recommended. Forms that ask for a resume get it attached automatically, and we'll pick up your skills from it.", resume: true, f: [
    {t: "resume", onChange: () => drawWizard()}]},
  {t: "What kind of job are you looking for?", s: "Pick the closest one. It fills in typical job titles and skills, which you can change next.", role: true},
  {t: "Where and what to search", s: "Type and press Enter to add. Or click a suggestion.", req: ["keywords", "locations"], f: [
    {p: "keywords", t: "chips", live: true, l: "Job titles to search for *", ph: "e.g. Android Developer", sugg: () => [...new Set([...(ROLES.find(r => r.id === W.role) || {kw: []}).kw, ...relatedTitles(W.keywords)])]},
    {p: "skills", from: "keywords", t: "titleSugg"},
    {p: "locations", t: "chips", l: "Locations *", ph: "e.g. Bangalore", sugg: CITIES}]},
  {t: "Your main skills", s: "The bot applies only when a job mentions enough of these. 4–6 skills works best.", req: ["skills"], f: [
    {p: "skills", t: "skills", l: "Skills *", onPack: r => { W.role = r.id; }},
    {p: "skills", from: "keywords", t: "titleSugg"},
    {p: "skills", t: "resumeSugg"},
    {p: "skill_years", t: "number", step: .5, l: "Years using these skills", unit: "years", h: "Used for “How many years of X?” questions. You can set each skill separately later."}]},
  {t: "Quick answers for applications", s: "Almost every site asks these. Leave blank anything you'd rather not fill in now.", f: [
    {p: "notice", t: "number", l: "Notice period", unit: "days", str: true}, {p: "current_location", t: "text", l: "Current city"},
    {p: "current_ctc", t: "number", step: 1000, l: "Current salary (CTC)", unit: "per year", str: true}, {p: "expected_ctc", t: "number", step: 1000, l: "Expected salary (CTC)", unit: "per year", str: true}]},
  {t: "AI helper (optional)", s: "Answers unusual application questions from your profile. You can skip this and add it later in Settings.", f: [
    {p: "ai_provider", t: "seg", l: "AI service", opts: [["", "Skip for now"], ["gemini", "Gemini (free tier)"], ["claude", "Claude"], ["openai", "OpenAI"]], rerender: true},
    {p: "ai_key", t: "password", l: "API key", show: w => !!w.ai_provider, h: 'Gemini: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com</a> → Get API key'},
    {p: "about_me", t: "textarea", rows: 7, l: "About me", h: "We wrote this from your answers. Add your education and current company. The AI also reads your resume if you uploaded one."}]},
];
function wizAbout() {
  const sk = (W.skills || []).map(s => s.split("|")[0]).join(", ");
  return `Name: ${W.name}. ${(W.keywords || [])[0] || "Professional"} with ${W.experience_years} years total experience, based in ${W.current_location || (W.locations || [])[0] || ""}.
Skills: ${sk}${W.skill_years ? ` (${W.skill_years} yrs)` : ""}.
Notice period: ${W.notice || "?"} days. Current CTC: ${W.current_ctc || "?"}. Expected CTC: ${W.expected_ctc || "?"}.
Looking for: permanent, full-time roles in ${(W.locations || []).join(", ")}.
Education: (add your degree, college and year)
Current company and role: (add here)`;
}
function drawWizard() {
  const s = WSTEPS[wStep], box = $("#wizard");
  if (wStep === WSTEPS.length - 1 && (!W.about_me || W.about_me.startsWith("Name: "))) W.about_me = wizAbout();
  box.innerHTML = `<div class="small muted">Step ${wStep + 1} of ${WSTEPS.length}</div><div class="steps-dots">${WSTEPS.map((_, i) => `<span class="${i <= wStep ? "on" : ""}"></span>`).join("")}</div>
    <h2 style="margin-top:14px">${s.t}</h2><div class="muted">${s.s}</div><div id="wbody"></div>
    <div class="modal-acts">${wStep ? `<button class="btn ghost l" id="wBack">← Back</button>` : ""}${s.role ? "" : `<button class="btn primary lg" id="wNext">${wStep === WSTEPS.length - 1 ? "Finish setup 🎉" : s.resume && !(RES && RES.has) ? "Skip for now →" : "Continue →"}</button>`}</div>`;
  const body = $("#wbody");
  if (s.role) {
    const fit = RES && RES.readable ? guessRole(RES.text) : null;
    body.innerHTML = `<div class="roles">${ROLES.map(r => `<div class="choice ${W.role === r.id ? "on" : ""}" data-r="${r.id}">${r.id === fit ? '<span class="tag">FITS YOUR RESUME</span>' : ""}<span class="em">${r.e}</span><b>${esc(r.n)}</b></div>`).join("")}</div>`;
    $$("[data-r]", body).forEach(c => c.onclick = () => {
      const r = ROLES.find(x => x.id === c.dataset.r); W.role = r.id;
      if (r.kw.length) { W.keywords = [...r.kw]; W.skills = [...r.sk]; W.title_must_include = []; }
      $$("[data-r]", body).forEach(x => x.classList.toggle("on", x === c));
      setTimeout(() => { wStep++; drawWizard(); }, 180);
    });
  } else {
    const f = h(`<div class="form"></div>`); body.append(f);
    renderForm(f, s.f, W, () => {});
  }
  $("#wBack")?.addEventListener("click", () => { wStep--; drawWizard(); });
  $("#wNext")?.addEventListener("click", async e => {
    const miss = (s.req || []).filter(k => Array.isArray(W[k]) ? !W[k].filter(Boolean).length : !String(W[k] ?? "").trim());
    if (miss.length) return toast("Please fill in the fields marked *", true);
    if (wStep < WSTEPS.length - 1) { wStep++; return drawWizard(); }
    e.currentTarget.disabled = true;
    try { await api("/api/setup", {body: W}); box.closest(".overlay").remove(); await refresh(); go("home"); finishWizard(); }
    catch (err) { toast(err.message, true); e.currentTarget.disabled = false; }
  });
}
function finishWizard() {
  const m = modal(`<div style="text-align:center;padding:10px 0"><div style="font-size:52px">🎉</div><h2>You're all set${W.name ? ", " + esc(W.name.split(" ")[0]) : ""}!</h2>
    <p class="muted" style="max-width:440px;margin:8px auto 0">Next, sign in to your job sites once, then try a <b>test run</b>. It finds and scores jobs without applying, so you can check everything looks right.</p></div>
    <div class="modal-acts" style="justify-content:center"><button class="btn" data-x>Look around first</button><button class="btn primary lg" data-s>Sign in to job sites →</button></div>`);
  $("[data-x]", m).onclick = () => m.remove();
  $("[data-s]", m).onclick = () => { m.remove(); openSignIn(); };
}

/* =================================================================== start */
applyTheme(); applyAdv();
refresh().then(() => { const [p, a] = location.hash.slice(1).split(":"); go(p || store.get("page", "home"), a); loop(); });
</script>
